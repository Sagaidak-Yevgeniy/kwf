services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: kwf
      POSTGRES_USER: kwf
      POSTGRES_PASSWORD: kwf
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://kwf:kwf@db:5432/kwf
      JWT_SECRET: change-me
      CORS_ORIGINS: http://localhost:5173
    ports: ["8000:8000"]
    depends_on: [db]
  frontend:
    build: ./frontend
    ports: ["5173:80"]
    depends_on: [backend]
volumes:
  pgdata: {}
